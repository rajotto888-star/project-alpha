name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (shared)
        run: pnpm --filter @project-alpha/shared typecheck

      - name: Typecheck (worker)
        run: pnpm --filter @project-alpha/worker typecheck

      - name: Typecheck (web)
        run: pnpm --filter @project-alpha/web typecheck

      - name: Unit tests (worker)
        run: pnpm --filter @project-alpha/worker test

      # Vault crypto + SSE client contract (browser half of the wire protocol).
      - name: Unit tests (web)
        run: pnpm --filter @project-alpha/web test

      # The SPA ships as a static production bundle — a broken build must fail CI.
      - name: Build web (production bundle)
        run: pnpm --filter @project-alpha/web build

      # Worker bundle + production binding keys must resolve. --dry-run makes no
      # network calls and needs no CLOUDFLARE_API_TOKEN (proven with wrangler 3.114.17),
      # so it is not gated on a token — gating would hide real breakage.
      - name: Worker dry-run (production env)
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --dry-run --env production

      # Task F guard: fail the build if a provider key pattern is committed anywhere.
      - name: Secret leak scan
        run: |
          if grep -rnE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' \
               --include='*.ts' --include='*.tsx' --include='*.json' --include='*.toml' \
               --exclude-dir=node_modules . ; then
            echo "Possible provider API key committed." >&2
            exit 1
          fi
          echo "No hardcoded provider keys found."

      # LOCKED: keys/prompts/outputs must never be persisted server-side.
      - name: Audit schema guard
        run: |
          if grep -rniE '\b(prompt|output|messages|headers|cookie|authorization|api_key|secret)\b' \
               apps/worker/migrations/ ; then
            echo "audit/migration contains a content-bearing column." >&2
            exit 1
          fi
          echo "Migration is metadata-only."
